AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Innovating Teams - API serverless (API Gateway + Lambda + DynamoDB) con despliegue canario

Parameters:
  AppVersion:
    Type: String
    Default: '1.0.0'
    Description: Versión desplegada; cambiarla en cada deploy permite ver en X-App-Version qué versión respondió.
  CanaryPercent:
    Type: String
    Default: '20'
    Description: Porcentaje de requests de GET /api/equipos que atiende la v2 (canario dentro de la API).

Globals:
  Api:
    BinaryMediaTypes:
      - multipart~1form-data

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/            # generado por `npm run build`
      Handler: lambda.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 15
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DataTable
          APP_VERSION: !Ref AppVersion
          CANARY_PERCENT: !Ref CanaryPercent
          S3_BUCKET: !Ref FrontendBucket
          PUBLIC_BASE_URL: !Sub https://${FrontendBucket.RegionalDomainName}
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/{proxy+}
            Method: ANY

  # NoSQL: una sola tabla, pk = entidad y sk = id (ver src/infrastructure/persistence/DocumentStore.ts).
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

Outputs:
  ApiUrl:
    Description: URL base de la API
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api
  FrontendUrl:
    Description: URL del frontend (sitio web S3)
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucketName:
    Value: !Ref FrontendBucket
