$kind: http-request
url: "{{baseUrl}}/login/admin/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@demo.com",
      "password": "admin-demo-123"
    }
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set('token', pm.response.json().token);
    language: text/javascript
order: 1000
